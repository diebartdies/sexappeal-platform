version: '3.8'

services:
  mongo:
    # Server requires MongoDB 4.4 — do not upgrade to 5.x/6.x/7.x
    image: mongo:4.4
    pull_policy: if_not_present
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    container_name: sexappeal_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  app:
    build: .
    container_name: sexappeal_app
    restart: on-failure
    env_file: .env
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/sexappeal
    volumes:
      - ./public:/app/public
      - ./controllers:/app/controllers
      - ./utils:/app/utils
      - ./config:/app/config
      - ./server.js:/app/server.js
    depends_on:
      mongo:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: sexappeal_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf/live/sexappeal.drsrv.net.ar:/etc/nginx/certs:ro
    depends_on:
      - app

volumes:
  mongo_data:
    name: sexappeal_mongo_data
