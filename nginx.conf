events {
    worker_connections 1024;
}

http {
    client_max_body_size 100M;
    # Docker embedded DNS; variable proxy_pass avoids startup failure if "app" is not resolvable yet.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Enable Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        # selfappeal.drsrv.net.ar = neutral SelfAppeal alias for outreach links (no "sex").
        server_name sexappeal.drsrv.net.ar selfappeal.drsrv.net.ar localhost;

        # ACME HTTP-01 challenge (Let's Encrypt webroot). MUST be reachable over
        # plain HTTP BEFORE issuing any new cert (e.g. the selfappeal cert). Served from
        # the certbot webroot bind-mounted into this container at /var/www/certbot
        # (see docker-compose.yml: ./certbot/www:/var/www/certbot:ro).
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS — main site
    server {
        listen 443 ssl;
        server_name sexappeal.drsrv.net.ar localhost;

        ssl_certificate /etc/nginx/certs-live/sexappeal.drsrv.net.ar/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs-live/sexappeal.drsrv.net.ar/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            set $backend http://app:5000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Optional alias vhost (selfappeal.drsrv.net.ar) — generated on deploy when TLS exists.
    # See scripts/nginx-write-selfappeal-conf.sh and nginx/conf.d/selfappeal.ssl.conf
    include /etc/nginx/conf.d/*.conf;
}
