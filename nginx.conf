events {
    worker_connections 1024;
}

http {
    client_max_body_size 100M;

    # Enable Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        # selfappeal.drsrv.net.ar = neutral SelfAppeal alias for outreach links (no "sex").
        server_name sexappeal.drsrv.net.ar selfappeal.drsrv.net.ar localhost;

        # ACME HTTP-01 challenge (Let's Encrypt webroot). MUST be reachable over
        # plain HTTP BEFORE issuing any new cert (e.g. the selfappeal cert). Served from
        # the certbot webroot bind-mounted into this container at /var/www/certbot
        # (see docker-compose.yml: ./certbot/www:/var/www/certbot:ro).
        # NOTE: this location is intentionally placed before the catch-all 301 so
        # the challenge is NOT redirected to HTTPS. A server-level `return 301`
        # would short-circuit location matching, so the redirect lives in `location /`.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server
    server {
        listen 443 ssl;
        server_name sexappeal.drsrv.net.ar localhost;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # --- Strict SSL/TLS Security Settings ---
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Enforce HSTS (Strict Transport Security)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://app:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ===========================================================================
    # NEUTRAL ALIAS DOMAIN — selfappeal.drsrv.net.ar (SelfAppeal outreach)
    # ---------------------------------------------------------------------------
    # Serves the SAME app over HTTPS for WhatsApp step-2 links that must not
    # contain the word "sex". Preserves $host (NO redirect to sexappeal.drsrv.net.ar).
    #
    # Requires its OWN TLS cert at /etc/nginx/certs-selfappeal/ (certbot --webroot).
    # Bind-mount: ./certbot/conf/live/selfappeal.drsrv.net.ar (docker-compose.yml).
    # ===========================================================================
    server {
        listen 443 ssl;
        server_name selfappeal.drsrv.net.ar;

        ssl_certificate /etc/nginx/certs-selfappeal/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs-selfappeal/privkey.pem;

        # --- Strict SSL/TLS Security Settings (mirrors the main HTTPS block) ---
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://app:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}