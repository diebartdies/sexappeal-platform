events {
    worker_connections 1024;
}

http {
    client_max_body_size 100M;

    # Enable Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        # fcwa.drsrv.net.ar = neutral alias for WhatsApp outreach links (no "sex").
        server_name sexappeal.drsrv.net.ar fcwa.drsrv.net.ar localhost;

        # ACME HTTP-01 challenge (Let's Encrypt webroot). MUST be reachable over
        # plain HTTP BEFORE issuing any new cert (e.g. the fcwa cert). Served from
        # the certbot webroot bind-mounted into this container at /var/www/certbot
        # (see docker-compose.yml: ./certbot/www:/var/www/certbot:ro).
        # NOTE: this location is intentionally placed before the catch-all 301 so
        # the challenge is NOT redirected to HTTPS. A server-level `return 301`
        # would short-circuit location matching, so the redirect lives in `location /`.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server
    server {
        listen 443 ssl;
        server_name sexappeal.drsrv.net.ar localhost;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # --- Strict SSL/TLS Security Settings ---
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Enforce HSTS (Strict Transport Security)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://app:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ===========================================================================
    # NEUTRAL ALIAS DOMAIN — fcwa.drsrv.net.ar
    # ---------------------------------------------------------------------------
    # Serves the SAME app over HTTPS for WhatsApp outreach links that must not
    # contain the word "sex". It preserves $host (NO redirect to the main domain),
    # so visitors stay on fcwa.drsrv.net.ar.
    #
    # This domain needs its OWN TLS cert: the existing sexappeal cert cannot be
    # expanded because sexappeal.drsrv.net.ar has no public A record, so HTTP-01
    # validation of that name would fail. The fcwa cert is bind-mounted at
    # /etc/nginx/certs-fcwa (see docker-compose.yml:
    #   ./certbot/conf/live/fcwa.drsrv.net.ar:/etc/nginx/certs-fcwa:ro).
    #
    # !!! REQUIRES the fcwa cert at /etc/nginx/certs-fcwa/ (issued via certbot
    # --webroot). If those files are missing, nginx FAILS TO START. The cert is
    # bind-mounted from ./certbot/conf/live/fcwa.drsrv.net.ar (docker-compose.yml).
    # ===========================================================================
    server {
        listen 443 ssl;
        server_name fcwa.drsrv.net.ar;

        ssl_certificate /etc/nginx/certs-fcwa/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs-fcwa/privkey.pem;

        # --- Strict SSL/TLS Security Settings (mirrors the main HTTPS block) ---
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://app:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}