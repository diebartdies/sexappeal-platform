<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SexAppeal - Join the Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .role-selection {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .role-option {
            flex: 1;
            padding: 15px;
            border: 1px solid var(--primary-gold);
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }
        .role-option.active {
            background: var(--primary-gold);
            color: var(--dark-bg);
        }
        #professionalFields {
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            padding-top: 20px;
            margin-top: 20px;
        }
    </style>
    <!-- SEO & Open Graph Tags -->
    <meta name="description" content="SexAppeal - The Architecture of Intimacy. Directorio exclusivo de acompañantes VIP y Living Treasures.">
    <meta property="og:title" content="SexAppeal Platform">
    <meta property="og:description" content="El santuario definitivo para conexiones de alto nivel y discreción absoluta.">
    <meta property="og:image" content="https://sexappeal.drsrv.net.ar/SexAppeal_logo_black.png">
    <meta property="og:url" content="https://sexappeal.drsrv.net.ar">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#D4AF37">
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="logo"><img src="/SexAppeal_logo_black.png" alt="SexAppeal Logo" style="height: 400px; width: auto;"></a>
        </header>

        <section style="display: flex; justify-content: center; padding-bottom: 100px;">
            <div class="card" style="width: 100%; max-width: 600px;">
                <h2 class="gold-text" style="margin-bottom: 30px;">Registration</h2>
                <div style="text-align: center; margin-bottom: 25px;">
        <img src="/SexAppeal_logo_black.png" alt="SexAppeal Logo" style="height: 70px; width: auto; background-color: #000; border-radius: 8px; padding: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.5);">
    </div>
    <form id="registerForm">
        <hr>
        <h4 class="gold-text">Verification Documents</h4>

        <div class="form-group">
            <label for="regIdPhotoFront">Photo of your ID (Front) <span class="required-star">*</span></label>
            <input type="file" id="regIdPhotoFront" name="verificationDocuments" accept="image/*" required>
        </div>

        <div class="form-group">
            <label for="regIdPhotoBack">Photo of your ID (Back) <span class="required-star">*</span></label>
            <input type="file" id="regIdPhotoBack" name="verificationDocuments" accept="image/*" required>
        </div>

        <div class="form-group">
            <label for="regSelfiePhoto">Selfie holding your ID <span class="required-star">*</span></label>
            <input type="file" id="regSelfiePhoto" name="verificationDocuments" accept="image/*" required>
        </div>
        <hr>
                    <div id="registerAlert" class="alert hidden"></div>
                    
                    <input type="email" placeholder="Email" required id="regEmail">
                    <input type="password" placeholder="Password (Min 6 chars)" required id="regPassword" minlength="6">
                    
                    <label style="display: block; margin-bottom: 10px; font-weight: bold;">Select Your Role:</label>
                    <div class="role-selection">
                        <div class="role-option active" data-role="user" onclick="setRole('user')">Seeker (User)</div>
                        <div class="role-option" data-role="professional" onclick="setRole('professional')">Treasure (Professional)</div>
                    </div>
                    <input type="hidden" id="regRole" value="user">

                    <div id="professionalFields" class="hidden">
                        <h3 class="gold-text" style="margin-bottom: 20px;">Professional Profile</h3>
                        <input type="text" placeholder="Alias / Apodo" id="regAlias">
                        <textarea placeholder="Bio (Max 500 chars)" id="regBio" style="width: 100%; padding: 12px; background: transparent; border: 1px solid var(--primary-gold); color: white; margin-bottom: 20px; font-family: inherit;" rows="4"></textarea>
                        
                        <div style="margin-bottom: 20px;">
                            <label style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer;"><input type="checkbox" id="regOwnApartment" style="width: auto;"> I have my own apartment for hosting</label>
                            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;"><input type="checkbox" id="regFantasyWardrobe" style="width: auto;"> I have sexy / fantasy wardrobe options</label>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <select id="regProvince" name="province" required>
        <option value="">Loading...</option>
    </select>
                            <select id="regCity" name="city" required>
        <option value="">Loading...</option>
    </select>
                        </div>
                        <select id="regNeighborhood" name="neighborhood">
        <option value="">Loading...</option>
    </select>
                        
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <input type="text" placeholder="Measurements (e.g. 90-60-90)" id="regMeasurements">
                            <input type="text" placeholder="Height (e.g. 170cm)" id="regHeight">
                        </div>
                        
                        <select id="regServices" name="services" multiple size="5">
        <option value="Massage">Massage</option>
        <option value="Virtual Connection">Virtual Connection</option>
        <option value="love alchemy">love alchemy</option>
        <option value="Fantasies">Fantasies</option>
        <option value="Content Delivery">Content Delivery</option>
    </select>
                        <input type="text" placeholder="Attributes (comma separated, e.g. love alchemy)" id="regAttributes">
                    </div>

                    <button type="submit" style="width: 100%; margin-top: 20px;">Register</button>
                </form>
                <p style="margin-top: 20px; text-align: center;">
                    Already have access? <a href="index.html" style="color: var(--primary-gold);">Login here</a>
                </p>
            </div>
        </section>
    </div>

    <script>
        function setRole(role) {
            document.getElementById('regRole').value = role;
            document.querySelectorAll('.role-option').forEach(opt => {
                opt.classList.toggle('active', opt.dataset.role === role);
            });
            document.getElementById('professionalFields').classList.toggle('hidden', role !== 'professional');
            
            // Toggle required fields
            const profInputs = document.querySelectorAll('#professionalFields input, #professionalFields textarea');
            profInputs.forEach(input => {
                if (role === 'professional') {
                    if (input.id !== 'regNeighborhood' && input.id !== 'regMeasurements' && input.id !== 'regHeight') {
                        // Keep some optional
                    }
                }
            });
        }
    </script>
    <script src="js/app.js"></script>
</body>
</html>
