<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico">
    <title>SexAppeal - Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=8.6">
    <link rel="stylesheet" href="/css/responsive.css?v=8.6">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#D4AF37">
    <meta name="color-scheme" content="dark">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <a href="index.html" class="logo"><img src="/SexAppeal_logo_black.png" alt="SexAppeal Logo" class="page-logo"></a>
        </header>

        <section style="display: flex; justify-content: center; padding-bottom: 100px;">
            <div class="card" style="width: 100%; max-width: 400px; text-align: center;">
                <h2 class="gold-text" style="margin-bottom: 30px;">Verify Your Email</h2>
                <p style="margin-bottom: 20px;">Please enter the 6-digit code sent to your email.</p>
                <div style="text-align: center; margin-bottom: 25px;">
        <img src="/SexAppeal_logo_black.png" alt="SexAppeal Logo" style="height: 70px; width: auto; background-color: #000; border-radius: 8px; padding: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.5);">
    </div>
    <form id="verifyForm">
                    <div id="verifyAlert" class="alert hidden"></div>
                    <input type="hidden" id="verifyEmail">
                    <div class="form-group">
                        <label for="verifyCode">6-Digit Code</label>
                        <input type="text" placeholder="6-Digit Code" required id="verifyCode" maxlength="6" style="text-align: center; font-size: 1.5rem; letter-spacing: 5px;">
                    </div>
                    <button type="submit" style="width: 100%; margin-top: 20px;">Verify</button>
                </form>
            </div>
        </section>
    </div>

    <script src="/js/app.js?v=8.6" type="module"></script>
    <script>
        // Pre-fill email from URL if available
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        if (email) {
            document.getElementById('verifyEmail').value = email;
        }
    </script>
</body>
</html>
