<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SexAppeal - Recover Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- SEO & Open Graph Tags -->
    <meta name="description" content="SexAppeal - The Architecture of Intimacy. Directorio exclusivo de acompañantes VIP y Living Treasures.">
    <meta property="og:title" content="SexAppeal Platform">
    <meta property="og:description" content="El santuario definitivo para conexiones de alto nivel y discreción absoluta.">
    <meta property="og:image" content="https://sexappeal.drsrv.net.ar/SexAppeal_logo_black.png">
    <meta property="og:url" content="https://sexappeal.drsrv.net.ar">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#D4AF37">
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="logo"><img src="/SexAppeal_logo_black.png" alt="SexAppeal Logo" style="height: 400px; width: auto;"></a>
        </header>

        <section style="display: flex; justify-content: center; padding-bottom: 100px;">
            <div class="card" style="width: 100%; max-width: 400px; text-align: center;">
                <h2 class="gold-text" style="margin-bottom: 30px;">Recover Access</h2>
                
                <!-- Forgot Password Form -->
                <form id="forgotPasswordForm">
                    <p style="margin-bottom: 20px;">Enter your email to receive a recovery code.</p>
                    <div id="forgotAlert" class="alert hidden"></div>
                    <input type="email" placeholder="Email" required id="forgotEmail">
                    <button type="submit" style="width: 100%; margin-top: 10px;">Send Code</button>
                </form>

                <!-- Reset Password Form (Hidden by default) -->
                <form id="resetPasswordForm" class="hidden">
                    <p style="margin-bottom: 10px;">Recovering access for:</p>
                    <p id="displayEmail" class="gold-text" style="margin-bottom: 20px; font-weight: bold;"></p>
                    <div id="resetAlert" class="alert hidden"></div>
                    <input type="hidden" id="resetEmail">
                    <input type="text" placeholder="6-Digit Code" required id="resetCode" maxlength="6" style="text-align: center; font-size: 1.5rem; letter-spacing: 5px;">
                    <input type="password" placeholder="New Password (Min 6 chars)" required id="resetNewPassword" minlength="6">
                    <button type="submit" style="width: 100%; margin-top: 20px;">Reset Password</button>
                </form>

                <p style="margin-top: 20px;">
                    Back to <a href="index.html" style="color: var(--primary-gold);">Entrance</a>
                </p>
            </div>
        </section>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
