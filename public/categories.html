<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico">
    <title>SexAppeal - Discover Treasures</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=7.1">
    <!-- SEO & Open Graph Tags -->
    <meta name="description" content="SexAppeal - The Architecture of Intimacy. Directorio exclusivo de acompañantes VIP y Living Treasures.">
    <meta property="og:title" content="SexAppeal Platform">
    <meta property="og:description" content="El santuario definitivo para conexiones de alto nivel y discreción absoluta.">
    <meta property="og:image" content="https://sexappeal.drsrv.net.ar/SexAppeal_logo_black.png">
    <meta property="og:url" content="https://sexappeal.drsrv.net.ar">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#D4AF37">
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="logo"><img src="/SexAppeal_logo_black.png" alt="SexAppeal Logo" style="height: 400px; width: auto;"></a>
            <div id="loginStatus" class="login-status"></div>
        </header>

        <section>
            <div class="card" style="display: none;">
                <h2 class="gold-text">Discover Our Treasures</h2>
                <p style="margin-bottom: 30px; opacity: 0.8;">Filter by quality and service, or browse the full collection below.</p>
                <form id="filterForm">
                    <div class="filter-control">
                        <label for="provinceSelect">Province</label>
                        <select id="provinceSelect" name="province" class="form-select"></select>
                    </div>
                    <div class="filter-control">
                        <label for="citySelect">City / Neighborhood</label>
                        <select id="citySelect" name="city" class="form-select"></select>
                    </div>
                    <div class="filter-control" style="display: none;">
                        <label for="neighborhoodSelect">Neighborhood</label>
                        <select id="neighborhoodSelect" name="neighborhood" class="form-select"></select>
                    </div>
                    <div class="filter-control">
                        <label for="qualitySelect">Quality</label>
                        <select id="qualitySelect" class="form-select">
                            <option value="">All</option>
                            <option value="Premium">Premium</option>
                            <option value="Gold">Gold</option>
                            <option value="Silver">Silver</option>
                            <option value="Standard">Standard</option>
                        </select>
                    </div>
                    <div class="filter-control">
                        <label>Specialty</label>
                        <div class="custom-select-wrapper" style="position: relative;">
                            <div id="specialtyDropdownBtn" class="form-select" style="cursor: pointer; display: flex; justify-content: space-between; align-items: center;">
                                <span id="specialtyBtnText">All</span>
                                <span style="font-size: 0.8rem;">&#9660;</span>
                            </div>
                            <div id="specialtyCheckboxes" style="display: none; position: absolute; top: 100%; left: 0; width: 100%; background: #222; border: 1px solid var(--primary-gold); border-radius: 4px; border-top-left-radius: 0; border-top-right-radius: 0; z-index: 100; max-height: 200px; overflow-y: auto; padding: 10px; box-sizing: border-box; box-shadow: 0 4px 10px rgba(0,0,0,0.8);">
                                <div>Loading...</div>
                            </div>
                        </div>
                    </div>
                    <button type="submit">Find Treasures</button>
                </form>
            </div>
            <div id="treasureGrid" class="grid">
                <!-- Professionals will be loaded here by default -->
            </div>
        </section>
    </div>
    <script src="/js/app.js?v=7.1" type="module"></script>
</body>
</html>
