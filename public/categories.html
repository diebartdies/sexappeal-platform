<body class="categories-page blueprint-theme">
    <div id="categoriesNotesBanner" class="blueprint-notes-banner" role="navigation" aria-label="Notas de Interés" hidden></div>

    <div class="container categories-container">
        <div class="categories-shell" role="main" id="main-content">
            <aside class="categories-frame categories-frame-side categories-frame-left" aria-label="SexAppeal">
                <a href="index.html" class="categories-brand-logo logo brand-logo-block">

            <section class="categories-frame categories-frame-center" data-module="DIR-01">

                    <h2 class="gold-text">Discover Our Treasures</h2>
                    <p style="margin-bottom: 30px; opacity: 0.8;">Filter by quality and service, or browse the full collection below.</p>
                    <form id="filterForm">
                        <div class="filter-control">
                            <label for="provinceSelect">Province</label>
                            <select id="provinceSelect" name="province" class="form-select"></select>
                        </div>
                        <div class="filter-control">

                        </div>
                        <div class="filter-control" style="display: none;">

                        </div>
                        <div class="filter-control">
                            <label for="qualitySelect">Quality</label>
                            <select id="qualitySelect" class="form-select">
                                <option value="">All</option>
                                <option value="Premium">Premium</option>
                                <option value="Gold">Gold</option>
                                <option value="Silver">Silver</option>
                                <option value="Standard">Standard</option>
                            </select>
                        </div>
                        <div class="filter-control">
                            <label>Specialty</label>
                            <div class="custom-select-wrapper" style="position: relative;">
                                <div id="specialtyDropdownBtn" class="form-select" style="cursor: pointer; display: flex; justify-content: space-between; align-items: center;">
                                    <span id="specialtyBtnText">All</span>
                                    <span style="font-size: 0.8rem;">&#9660;</span>
                                </div>
                                <div id="specialtyCheckboxes" style="display: none; position: absolute; top: 100%; left: 0; width: 100%; background: #0a0c10; border: 1px solid rgba(184, 146, 46, 0.35); border-radius: 4px; border-top-left-radius: 0; border-top-right-radius: 0; z-index: 100; max-height: 200px; overflow-y: auto; padding: 10px; box-sizing: border-box;">

                                </div>
                            </div>

                        <button type="submit" class="sa-btn sa-btn--active">Find Treasures</button>
                    </form>
                </div>
                <div class="treasure-grid-slot" id="treasureGridSlot">
                    <div id="pageLoader"><p>Loading treasures...</p></div>
                    <div id="treasureGrid" class="grid hidden"></div>
                </div>
            </section>
