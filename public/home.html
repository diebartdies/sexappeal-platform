<body>
    <div class="container">
        <header class="page-header">
            <a href="index.html" class="logo"><img src="/SexAppeal_logo_black.png" alt="SexAppeal Logo" class="page-logo"></a>
            <nav class="page-nav">
                <a href="login.html" id="proEntranceBtn" style="color: var(--primary-gold); margin: 0 15px; text-decoration: none;">Professional Entrance</a>

        </header>

        <section id="discovery" style="margin-top: 50px;">
            <div style="text-align: center; margin-bottom: 40px;">
                <h2 class="gold-text" style="font-size: 2.5rem; font-weight: 300; letter-spacing: 2px; margin-bottom: 10px;">Living Treasures</h2>

            <div id="treasureGrid" class="grid">
                <!-- Treasures will be loaded here dynamically by /js/app.js?v=7.1 -->
                <div class="card" style="grid-column: 1 / -1; text-align: center; color: #888;">
                    Unveiling the collection...
                </div>
            </div>
        </section>
    </div>

    <script src="/js/app.js?v=7.4" type="module"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Check if user is a Professional to update the top nav link
            const userStr = localStorage.getItem('user');
            if (userStr) {
                try {
                    const user = JSON.parse(userStr);
                    if (user.role === 'professional' || user.role === 'admin') {
                        const proBtn = document.getElementById('proEntranceBtn');
                        proBtn.textContent = 'My Dashboard';
                        proBtn.href = 'dashboard.html';
                    }
                } catch(e) {}
            }

            // Load the treasures from the database
            loadTreasures();
        });
    </script>
