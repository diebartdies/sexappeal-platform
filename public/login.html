<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SexAppeal - Professional Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="logo">SEXAPPEAL</a>
            <div id="loginStatus"></div>
        </header>

        <section style="display: flex; justify-content: center; padding-bottom: 100px;">
            <div class="card" style="width: 100%; max-width: 400px; text-align: center;">
                <h2 class="gold-text" style="margin-bottom: 30px;">Professional Login</h2>
                <form id="loginForm">
                    <div id="loginAlert" class="alert hidden"></div>
                    
                    <input type="email" placeholder="Email" required id="email">
                    <input type="password" placeholder="Password" required id="password">
                    
                    <button type="submit" style="width: 100%; margin-top: 20px;">Enter Sanctuary</button>
                </form>
                
                <div style="margin-top: 20px; font-size: 0.9rem;">
                    <a href="recover.html" style="color: var(--primary-gold); text-decoration: none;">Forgot Password?</a>
                    <br><br>
                    Don't have an access yet? <a href="register.html" style="color: var(--primary-gold); text-decoration: none;">Register here</a>
                </div>
            </div>
        </section>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
