<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico">
    <title>SexAppeal - Professional Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=8.6">
    <link rel="stylesheet" href="/css/responsive.css?v=8.6">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#B8922E">
    <meta name="color-scheme" content="dark">


    <!-- SEO & Open Graph Tags -->
    <meta name="description" content="SexAppeal - The Architecture of Intimacy. Directorio exclusivo de acompañantes VIP y Living Treasures.">
    <meta property="og:title" content="SexAppeal Platform">
    <meta property="og:description" content="El santuario definitivo para conexiones de alto nivel y discreción absoluta.">
    <meta property="og:image" content="https://sexappeal.drsrv.net.ar/SexAppeal_logo_black.png">
    <meta property="og:url" content="https://sexappeal.drsrv.net.ar">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#D4AF37">
</head>
<body class="landing-page login-page">
    <div class="container landing-container">
        <section class="hero landing-dual" id="loginPage">
            <div class="landing-frame landing-frame-logo">
                <div class="landing-frame-inner">
                    <img class="landing-logo" src="/SexAppeal_logo_black.png" alt="SexAppeal Logo">
                </div>
            </div>

            <div class="landing-frame landing-frame-auth landing-login-card">
                <div class="landing-frame-inner landing-auth-inner">
                    <h2 class="gold-text landing-login-heading">Professional Login</h2>
                    <p class="landing-login-sub">Sign in with your professional account email.</p>

                    <div style="text-align: center; margin-bottom: 25px;">
        <img src="/SexAppeal_logo_black.png" alt="SexAppeal Logo" style="height: 70px; width: auto; background-color: #000; border-radius: 8px; padding: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.5);">
    </div>
    <form id="loginForm" class="landing-login-form">
                        <div id="loginAlert" class="alert hidden"></div>
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" placeholder="Email Address" required id="email" autocomplete="username">
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" placeholder="Password" required id="password" autocomplete="current-password">
                        </div>
                        <button type="submit" class="landing-btn landing-btn-login">Enter Sanctuary</button>
                    </form>

                    <p class="landing-forgot">
                        <a href="/recover.html" data-open-password-recovery>Forgot Password?</a>
                    </p>

                    <p class="landing-register-link">
                        Don't have an access yet?
                        <a href="/register.html">Register as a professional</a>
                    </p>
                </div>
            </div>
        </section>
    </div>

    <script src="/js/app.js?v=8.10" type="module"></script>
    <script src="/js/adminHome.js?v=1" defer></script>
</body>
</html>
